name: trotro_ticket
description: QR ticket app for Trotro busses with fraud lock
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  crypto: ^3.0.3
  pdf: 3.10.7
  printing: ^5.12.0
  firebase_core: ^2.24.2
  cloud_firestore: ^4.15.5
  firebase_auth: ^4.15.3
  connectivity_plus: ^6.0.3
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
