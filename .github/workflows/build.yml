name: Trotro APK Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Get your Trotro code
        uses: actions/checkout@v4

      - name: 2. Setup Java 17 (Android needs it)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 4. FIX - Create Android folder if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing - creating now..."
            flutter create . --platforms=android --org com.trotroticket.app --project-name trotro_ticket
          else
            echo "Android folder exists - good!"
          fi

      - name: 5. Clean and Get Packages
        run: |
          flutter clean
          flutter pub get

      - name: 6. BUILD APK FOR YOUR REALME!
        run: flutter build apk --debug --no-tree-shake-icons

      - name: 7. Upload APK - Download it!
        uses: actions/upload-artifact@v4
        with:
          name: Trotro-Ticket-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
