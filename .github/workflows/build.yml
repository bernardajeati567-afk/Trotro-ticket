name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Fix Gradle Project
        run: |
          mv lib/main.dart /tmp/main.dart.bak
          mv pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create . --project-name trotro_ticket --org com.trotro.gov --platforms=android --no-pub
          mv /tmp/main.dart.bak lib/main.dart
          mv /tmp/pubspec.yaml.bak pubspec.yaml
          flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: Trotro-GOV-APK
          path: build/app/outputs/flutter-apk/app-release.apk
