name: Build APK for Real Me Trotro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter create --project-name trotro_ticket --org com.trotro.ticket --platforms android .
      - run: flutter pub get
      - run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
          # --- FINAL FIX: Android 35 + NDK 27 + DESUGARING ---
          python3 <<'PY'
          import pathlib, re
          for fname in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              t = p.read_text()
              # 1. Force Android 35
              t = re.sub(r'compileSdk.*', 'compileSdk = 35', t)
              t = re.sub(r'targetSdk.*', 'targetSdk = 35', t)
              # 2. Force NDK 27 - plugins want 27.0.12077973
              if 'ndkVersion' in t:
                  t = re.sub(r'ndkVersion.*', 'ndkVersion = "27.0.12077973"', t)
              else:
                  t = t.replace('compileSdk = 35', 'compileSdk = 35\n    ndkVersion = "27.0.12077973"')
              # 3. Turn ON Desugaring - THIS IS THE FIX FOR flutter_local_notifications
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              # 4. Add desugar library if not there
              if 'desugar_jdk_libs' not in t:
                  if 'dependencies {' in t:
                      t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")', 1)
                  else:
                      t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              p.write_text(t)
              print('FIXED:', fname)
              print(t[:2000])
          PY
      - run: dart pub add flutter_launcher_icons
      - run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
      - run: dart run flutter_launcher_icons
      - run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
          # --- FIX AGAIN AFTER ICONS (icons reset file) ---
          python3 <<'PY'
          import pathlib, re
          for fname in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'compileSdk.*', 'compileSdk = 35', t)
              t = re.sub(r'targetSdk.*', 'targetSdk = 35', t)
              if 'ndkVersion' in t:
                  t = re.sub(r'ndkVersion.*', 'ndkVersion = "27.0.12077973"', t)
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'desugar_jdk_libs' not in t:
                  if 'dependencies {' in t:
                      t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")', 1)
              p.write_text(t)
              print('FIXED AGAIN:', fname)
          PY
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
