name: Build APK for Real Me Trotro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter pub upgrade printing pdf flutter_local_notifications || true
      - run: flutter pub get
      - run: |
          # FIX 1: Correct Gradle link - NO backslash this time
          sed -i 's|distributionUrl=.*|distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/gradle/wrapper/gradle-wrapper.properties
          python3 <<'PY'
          import pathlib, re
          for fname in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              p = pathlib.Path(fname)
              if not p.exists():
                  continue
              t = p.read_text()
              t = re.sub(r'compileSdk.*', 'compileSdk = 35', t)
              t = re.sub(r'targetSdk.*', 'targetSdk = 35', t)
              if 'ndkVersion' in t:
                  t = re.sub(r'ndkVersion.*', 'ndkVersion = "27.0.12077973"', t)
              if 'isCoreLibraryDesugaringEnabled' not in t:
                  t = t.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
              if 'desugar_jdk_libs' not in t:
                  if 'dependencies {' in t:
                      t = t.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")', 1)
              p.write_text(t)
              print('FIXED:', fname)
          PY
      - run: |
          # FIX 2: Only run icons IF icon.png exists, else SKIP - don't fail build
          if [ -f "assets/icon.png" ]; then
            dart pub add flutter_launcher_icons || true
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
            dart run flutter_launcher_icons || true
          else
            echo "No assets/icon.png found - skipping icons, building with default icon"
          fi
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
