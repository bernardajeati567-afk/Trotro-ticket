name: Build APK for Real Me Trotro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # --- FIX: Flutter 3.29 ALREADY USES ANDROID 35 - NO PATCH NEEDED ---
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
      - run: flutter pub get
      - run: flutter create --project-name trotro_ticket --org com.trotro.ticket --platforms android .
      - run: flutter pub get
      - run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-all.zip|' android/gradle/wrapper/gradle-wrapper.properties || true
          # --- BULLETPROOF: Python rewrites ANY compileSdk line to 35 ---
          python3 -c "
          import pathlib, re
          for p in [pathlib.Path('android/app/build.gradle'), pathlib.Path('android/app/build.gradle.kts')]:
              if p.exists():
                  t = p.read_text()
                  t = re.sub(r'compileSdk.*', 'compileSdk = 35', t)
                  t = re.sub(r'targetSdk.*', 'targetSdk = 35', t)
                  t = re.sub(r'compileSdkVersion.*', 'compileSdkVersion 35', t)
                  p.write_text(t)
                  print('FIXED:', p)
                  print(p.read_text()[:1000])
          "
      - run: dart pub add flutter_launcher_icons
      - run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
      - run: dart run flutter_launcher_icons
      # --- FIX AGAIN AFTER ICONS - ICONS RESET THE FILE ---
      - run: |
          python3 -c "
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle')
          if p.exists():
              t = p.read_text()
              t = re.sub(r'compileSdk.*', 'compileSdk = 35', t)
              t = re.sub(r'targetSdk.*', 'targetSdk = 35', t)
              p.write_text(t)
              print('FIXED AGAIN')
          "
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
