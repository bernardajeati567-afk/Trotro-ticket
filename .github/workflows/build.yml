name: Build APK for Real Me Trotro
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - run: |
          # Create android folder if it does not exist in GitHub
          if [ ! -d "android" ]; then
            flutter create --project-name trotro_ticket --org com.trotro.ticket --platforms android .
          fi
      - run: flutter pub get
      - run: dart pub add flutter_launcher_icons
      - run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
      - run: dart run flutter_launcher_icons || true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
