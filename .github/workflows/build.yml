name: Build APK for Real Me Trotro
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - run: flutter pub get

      - run: |
          echo "Deleting OLD android folder to fix V1 embedding error"
          rm -rf android
          flutter create --project-name trotro_ticket --org com.trotro.ticket --platforms android .

      - run: flutter pub get

      - run: |
          # Only make icon if assets/icon.png exists
          if [ -f "assets/icon.png" ]; then
            cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
            min_sdk_android: 21
          EOF
            dart run flutter_launcher_icons || true
          else
            echo "No icon.png found, skipping icon step"
          fi

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
